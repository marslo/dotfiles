[files]
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true
extend-exclude = [
  "*color",
  "**/*.color",
  "**/.signingmanager/**",
  "**/*.current",
  "cht.sh.txt",
  # from pre-commit hook
  "**/vimrc.d/snips/**",
  "**/vimrc.d/shortcuts",
  "**/.gpg/**"
]

[default]
binary = false
check-filename = true
check-file = true
unicode=true
locale = "en"
extend-ignore-re = [
  # skip git SHA in changelog commit links, e.g. [3ba4ebe](https://.../commit/3ba4ebedc06...)
  '\[[0-9a-f]{7,40}\]\(https?://[^)]*/commit/[0-9a-f]{7,40}\)',
  "(?m)^\\s*(?:bind|alias|snip).*$",
  # [c]ommit, d[i]ff, ...
  "\\w*\\[\\w\\]\\w*",
  # ansicolor
  "\\w+=.*\\\\033.*",
  "\\w*\\\\033\\S+",
  # $(c xxx)..$(c)
  "\\$\\([cC][^)]+\\)\\S*",
  "\\S+\\$\\([cC][^)]+\\)\\S*",
  # vim modeline
  "(?m)^.*\\bvim:.*$",
  # regex: (?:xxx)
  '\(\?:.*?\)',
  # regex: ^\s*(...)
  '\^\\s\*\(.*?\)',
  # regex: \b(...)
  '\\b\(.*?\)',
  # regex: (?=\s*
  '\(\?=\\s\*'
]

# case-insensitive
[default.extend-words]
# <typo> = "<correction>"
caf = 'caf'
sav = 'sav'
wew = 'wew'
startin = 'startin'
siduction = 'siduction'
iz = 'iz'
windo = 'windo'
ue = 'ue'
mis = 'mis'
ot = 'ot'
ba = 'ba'
umark = 'umark'
bre = 'bre'
fpr = 'fpr'
